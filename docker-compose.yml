version: '3.8'

services:
  todo-list-react:
    build: .
    ports:
      - '3000:80'
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    volumes:
      - ./dist:/usr/share/nginx/html:ro

  reverse-proxy:
    image: nginx:alpine
    ports:
      - '80:80'
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - todo-list-react
